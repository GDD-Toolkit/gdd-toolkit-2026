# nginx config for the EC2 box (Elastic IP 3.140.167.228). Installed at
# /etc/nginx/sites-available/devethicstoolkit and symlinked into sites-enabled.
# Not applied by any workflow: copy it to the box by hand when it changes.
#
# This file includes the HTTPS (443) blocks and HTTP -> HTTPS redirects that
# `certbot --nginx` wrote into the live copy, so copying it over the live file keeps
# HTTPS working. Lines marked "# managed by Certbot" mirror what certbot generates.
# Both hostnames share ONE Let's Encrypt certificate (SAN: devethicstoolkit.umd.edu +
# cms.devethicstoolkit.umd.edu), so both 443 blocks point at the lineage
# /etc/letsencrypt/live/devethicstoolkit.umd.edu/. Confirm with `sudo certbot certificates`.

# Don't print the nginx version in the Server header or on error pages.
# This file is included in the http block. If /etc/nginx/nginx.conf already sets
# server_tokens (Ubuntu ships it commented out), `nginx -t` reports a duplicate:
# remove one of the two.
server_tokens off;

# Shared proxy settings for Strapi.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cache-Control for the website. It is set once at server level rather than in
# location blocks, because an add_header in a location drops every server-level
# add_header (the security headers below) for that location.
map $uri $frontend_cache_control {
    default "";
    # The app shell is never cached, so a deploy shows up on the next page load.
    /index.html "no-cache";
    # Vite names built files name-<8 char hash>.ext, so they can be cached forever.
    "~*-[A-Za-z0-9_-]{8}\.(js|css|woff2?|ttf|png|jpe?g|svg|webp)$" "public, max-age=31536000, immutable";
}

# Requests for the bare IP or any unknown name. Plain HTTP gets the connection closed
# (444), HTTPS refuses the TLS handshake, so the site is only served under its own names.
# Before this block, http://<IP>/ returned certbot's 404 and https://<IP>/ served the
# website (the first 443 block was the implicit default).
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

# The website: the built frontend. .github/workflows/deploy-frontend.yml builds it and
# deploy/site-deploy/publish-site.yml (run from gdd-cms) publishes it here.
server {
    server_name devethicstoolkit.umd.edu;

    root /var/www/devethicstoolkit/current;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Without `always` (only on 2xx/3xx), so error pages are never cached as immutable.
    add_header Cache-Control $frontend_cache_control;

    # Security headers. `always` adds them to error responses too. Don't put add_header
    # inside a location block below: it would drop all of these for that location.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    # Enforced now: it only forbids framing, which X-Frame-Options DENY already does.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # Report-only: browsers log violations in the devtools console but block nothing.
    # Built from what frontend/src loads:
    #   connect-src  Strapi API, the case-studies API Gateway, the globe's GeoJSON on
    #                raw.githubusercontent.com; /grants/api is same-origin ('self').
    #   img/media    uploads in the content-managment S3 bucket (signed URLs), Unsplash
    #                images on the project-planning page, CMS-hosted files.
    #   frame-src    YouTube and Canva embeds. ToolModal also iframes use_case_video and
    #                slideshow URLs that come from the CMS, so editors can add any host:
    #                check the console for frame-src reports on those pages.
    #   style-src    'unsafe-inline' because UI libraries inject <style> tags at runtime.
    # Switch to enforcing (rename the header to Content-Security-Policy and merge in
    # frame-ancestors 'none' from the header above) after browsing every page,
    # including login, podcast playback, the globe, tool modals and the case studies,
    # with the console open shows no CSP reports. Update the policy whenever the
    # frontend starts loading something from a new host.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cms.devethicstoolkit.umd.edu https://content-managment.s3.us-east-2.amazonaws.com https://images.unsplash.com; media-src 'self' blob: https://cms.devethicstoolkit.umd.edu https://content-managment.s3.us-east-2.amazonaws.com; font-src 'self' data:; connect-src 'self' https://cms.devethicstoolkit.umd.edu https://xwo9yyyg6c.execute-api.us-east-2.amazonaws.com https://raw.githubusercontent.com https://content-managment.s3.us-east-2.amazonaws.com; frame-src https://www.youtube.com https://youtube.com https://www.youtube-nocookie.com https://www.canva.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Hide dotfiles (.git, .env, ...) if one is ever published by mistake.
    # /.well-known/ stays reachable (certbot's acme-challenge and similar).
    location ~ /\.(?!well-known) {
        return 404;
    }

    # Built assets that don't exist are a 404, not the app shell.
    location ~* "-[A-Za-z0-9_-]{8}\.(js|css|woff2?|ttf|png|jpe?g|svg|webp)$" {
        try_files $uri =404;
    }

    # Grants read API (workers/grant-automation). Not hosted yet; when it is, proxy
    # /grants/api/ to it here.

    # Client-side routes (react-router) fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/devethicstoolkit.umd.edu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/devethicstoolkit.umd.edu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# The CMS (Strapi). Strapi's own security middleware sets its response headers.
server {
    server_name cms.devethicstoolkit.umd.edu;
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/devethicstoolkit.umd.edu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/devethicstoolkit.umd.edu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP -> HTTPS redirects, in the form certbot writes them.
server {
    if ($host = devethicstoolkit.umd.edu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name devethicstoolkit.umd.edu;
    return 404; # managed by Certbot
}

server {
    if ($host = cms.devethicstoolkit.umd.edu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name cms.devethicstoolkit.umd.edu;
    return 404; # managed by Certbot
}
