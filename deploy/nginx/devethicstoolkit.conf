# nginx config for the EC2 box (Elastic IP 3.140.167.228). Installed at
# /etc/nginx/sites-available/devethicstoolkit and symlinked into sites-enabled.
# Not applied by any workflow: copy it to the box by hand when it changes.
#
# certbot (`certbot --nginx`) adds the `listen 443 ssl` lines, the certificate paths,
# and the HTTP -> HTTPS redirects to these server blocks after DNS is live.

# Shared proxy settings for Strapi.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The website: the built frontend. .github/workflows/deploy-frontend.yml builds it and
# deploy/site-deploy/publish-site.yml (run from gdd-cms) publishes it here.
server {
    listen 80;
    server_name devethicstoolkit.umd.edu;

    root /var/www/devethicstoolkit/current;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite names built files name-<8 char hash>.ext, so they can be cached forever.
    location ~* "-[A-Za-z0-9_-]{8}\.(js|css|woff2?|ttf|png|jpe?g|svg|webp)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app shell is never cached, so a deploy shows up on the next page load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Grants read API (workers/grant-automation). Not hosted yet; when it is, proxy
    # /grants/api/ to it here.

    # Client-side routes (react-router) fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# The CMS. It is also the default_server, so requests to the bare IP (or any other
# name) keep reaching Strapi as they did before hostnames existed.
server {
    listen 80 default_server;
    server_name cms.devethicstoolkit.umd.edu;
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
