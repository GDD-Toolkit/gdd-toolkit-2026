# Serves the built Vite app. A reverse proxy (Caddy) terminates TLS in front of this.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite names built files name-<8 char hash>.ext, so they can be cached forever.
    # Unhashed files copied from public/ (videos, images, PDFs) use the default rule below.
    location ~* "-[A-Za-z0-9_-]{8}\.(js|css|woff2?|ttf|png|jpe?g|svg|webp)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app shell is never cached, so a deploy shows up on the next page load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes (react-router) fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
